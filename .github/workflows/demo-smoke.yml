name: Demo smoke test

on:
  push:
    branches:
      - build-your-ai-mvp
  workflow_dispatch:

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run demo
        run: python3 run_demo.py
      - name: Upload demo output
        uses: actions/upload-artifact@v4
        with:
          name: demo_output
          path: demo_output
